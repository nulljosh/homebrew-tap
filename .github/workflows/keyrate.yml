name: keyrate
# Installs the keyrate formula from this tap on a clean Mac and Linux, then runs its test (keyrate --check).
on:
  push:
    paths: ['Formula/keyrate.rb', '.github/workflows/keyrate.yml']
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew tap nulljosh/tap
      - run: brew install --build-from-source --verbose nulljosh/tap/keyrate
      - run: brew test nulljosh/tap/keyrate
      - run: keyrate --check
